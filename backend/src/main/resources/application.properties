spring.application.name=student-loan-agent

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=${SERVER_PORT:8081}

# ---------------------------------------------------------------
# PostgreSQL (all values come from environment variables)
# Example (PowerShell):
#   $env:DB_URL="jdbc:postgresql://localhost:5432/studentloan"
#   $env:DB_USERNAME="postgres"
#   $env:DB_PASSWORD="your-password"
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_loan_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ArsenalP@007}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# No entities and no tables yet: schema generation is disabled and
# the dialect is set explicitly so the application can start
# without an active database connection.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------
# AI schema discovery
# Only this PostgreSQL schema is exposed to the LLM and allowed
# through the SQL guardrail (allowlist - never expose everything).
# ---------------------------------------------------------------
app.db.schema=${DB_SCHEMA:public}

# ---------------------------------------------------------------
# Spring AI / Ollama (must be installed and running on port 11434)
# ---------------------------------------------------------------
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# ---------------------------------------------------------------
# Short-term conversation context (bounded, local POC only)
# ---------------------------------------------------------------
app.ai.conversation.max-messages=${AI_CONVERSATION_MAX_MESSAGES:10}
app.ai.conversation.max-rows=${AI_CONVERSATION_MAX_ROWS:5}
app.ai.conversation.max-chars=${AI_CONVERSATION_MAX_CHARS:4000}

# ---------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
